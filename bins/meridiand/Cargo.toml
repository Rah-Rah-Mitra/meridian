[package]
name = "meridiand"
description = "Meridian daemon — single-process composition root (SPEC §5): config → init crates → serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# gnu image build: cargo build -p meridiand --features rerank-ort
rerank-ort = ["meridian-query/rerank-ort"]

[dependencies]
meridian-common.workspace = true
meridian-api.workspace = true
meridian-egress.workspace = true
meridian-embed.workspace = true
meridian-vector.workspace = true
meridian-fetch.workspace = true
meridian-geo.workspace = true
meridian-analytics.workspace = true
meridian-index.workspace = true
meridian-privacy.workspace = true
meridian-query.workspace = true
meridian-rerank.workspace = true
meridian-searx.workspace = true
axum.workspace = true
libc.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rayon.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros"] }
tracing.workspace = true

[lints]
workspace = true
