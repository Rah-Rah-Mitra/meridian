# Meridian workspace — SPEC §5 (layout) and §7.1 (release profile).
# One binary (bins/meridiand), fifteen library crates. Crate boundaries == module ownership.

[workspace]
resolver = "3"
members = ["crates/*", "bins/meridiand"]

[workspace.package]
version = "0.1.0"
# v0.1.0 ships images + binaries (WBS 6.6); crates.io publication is a separate
# future decision — workspace path deps would need real version requirements
publish = false
edition = "2024"
# tantivy 0.26 requires 1.86 (verified 2026-06-10); keep in lockstep with the heaviest dep
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rah-Rah-Mitra/meridian"
authors = ["Rahul Mitra <mitrarahul2002@gmail.com>"]

[workspace.dependencies]
# External (heavy deps enter per phase, see docs/plan/01-wbs.md; bench-only deps are
# feature-gated inside meridian-eval so default `cargo check` stays light, ADR-D1)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
# SPEC §8 mandate (secure mode off = default): musl mallocng fragments badly
# under moka's small long-lived entries interleaved with large transient
# search churn — the P6 soak measured ~83KB retained per ~4KB cache entry.
mimalloc = "0.1"
moka = { version = "0.12", features = ["sync"] }
# --- Phase 1: runtime / http / telemetry ---
axum = "0.8"
tower = { version = "0.5", features = ["timeout", "limit", "load-shed", "util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "limit"] }
# socks: the anon lane's only transport is socks5h via the in-process listener
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip", "socks"] }
figment = { version = "0.10", features = ["toml", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
governor = "0.10"
texting_robots = "0.2"
dom_smoothie = "0.18"
whichlang = "0.1"
redb = "4"
blake3 = "1"
secrecy = "0.10"
zeroize = "1"
url = "2"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false }
rayon = "1"
# --- bench-only (meridian-eval features; versions verified 2026-06-10) ---
tantivy = { version = "0.26", features = ["zstd-compression"] }
# Rung 1 RESTORED at the P7 exit (ADR-07, risk #3): the portable rung-2 build's
# i8 cosine collapses with scale (recall 0.0 @1M); numkong 7.7.0's per-kernel
# probes now drop SVE/SME cleanly under zig/musl, keeping NEON±dotprod.
usearch = { version = "2.25" }
cxx = "1"
model2vec-rs = { version = "0.2", default-features = false, features = ["fancy-regex", "local-only"] }
tract-onnx = "0.23"
ort = "2.0.0-rc.12"
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", default-features = false }
arti-client = { version = "0.43", default-features = false }
# Runtime type names only (PreferredRuntime); features unify with arti-client's
tor-rtcompat = { version = "0.43", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# --- Phase 5: geo + analytics (versions verified 2026-06-11, ADR-10/15) ---
h3o = "0.10"
fst = "0.4"
petgraph = "0.8"
# GDELT slices are .CSV.zip; deflate only — no encryption/zstd variants needed
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
md-5 = "0.11"

# Internal crates
meridian-common = { path = "crates/meridian-common" }
meridian-api = { path = "crates/meridian-api" }
meridian-query = { path = "crates/meridian-query" }
meridian-index = { path = "crates/meridian-index" }
meridian-vector = { path = "crates/meridian-vector" }
meridian-embed = { path = "crates/meridian-embed" }
meridian-rank = { path = "crates/meridian-rank" }
meridian-rerank = { path = "crates/meridian-rerank" }
meridian-egress = { path = "crates/meridian-egress" }
meridian-privacy = { path = "crates/meridian-privacy" }
meridian-fetch = { path = "crates/meridian-fetch" }
meridian-searx = { path = "crates/meridian-searx" }
meridian-geo = { path = "crates/meridian-geo" }
meridian-analytics = { path = "crates/meridian-analytics" }
meridian-eval = { path = "crates/meridian-eval" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# SPEC §8.5 zero-copy discipline
redundant_clone = "deny"

# Dev-on-target reality (ADR-D1): full debuginfo for the whole workspace
# (arti + tantivy + analytics) exceeds the SD card. Line tables keep file:line
# in backtraces at a fraction of the size; CI is unaffected (its own disks).
[profile.dev]
debug = "line-tables-only"

# SPEC §7.1 — maximum performance-per-watt release profile
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Bench builds: same opt-level/target-cpu, thin LTO so CI cross-builds of the heavy
# bench dep set stay tractable. Divergence from the product profile is recorded in
# every bench report header; key gates are re-validated under the full release
# profile at Phase-1 exit (docs/plan/04-bench-plan.md).
[profile.release-bench]
inherits = "release"
lto = "thin"
codegen-units = 16
