# Meridian container topology — SPEC §4.
# Default profile: meridiand + searxng (direct lane only).
#   --profile anon    adds the Tor-proxied searxng-anon instance (egress only via
#                     the Arti SOCKS port meridiand serves on `back` — fail-closed
#                     by topology).
#   --profile regions is a SEPARATE compose file (compose.regions.yaml, Phase 4):
#                     host networking for WireGuard source-IP binding; documented
#                     tradeoff, never required for direct/anon users.
#
# Phase-0 skeleton: shapes, networks, hardening and healthchecks are final; image
# references activate once the Phase-0 GHCR image exists.

name: meridian

networks:
  front:
    driver: bridge
  back:
    driver: bridge
    internal: true

volumes:
  meridian-data:

services:
  meridiand:
    image: ghcr.io/rah-rah-mitra/meridian/meridiand:latest
    environment:
      # Container-internal bind; the host only ever sees 127.0.0.1 via `ports`
      MERIDIAN_SERVER__BIND: 0.0.0.0
      MERIDIAN_INDEX__DATA_DIR: /data
      MERIDIAN_SEARX__URL: http://searxng:8080
      # Operator sets this in .env (never committed); compose interpolates
      MERIDIAN_BEARER_TOKEN: ${MERIDIAN_BEARER_TOKEN:?set MERIDIAN_BEARER_TOKEN in .env}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 3g
    cpus: 4.0
    networks: [front, back]
    ports:
      # Loopback only — exposing beyond localhost is an explicit operator choice
      # gated behind "enable auth + TLS first" (SPEC §13.4)
      - "127.0.0.1:8080:8080"
    volumes:
      - meridian-data:/data
    tmpfs:
      - /tmp
    logging: &logcap
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/meridiand", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  searxng:
    # Digest-pinned (SPEC §13.2); bump deliberately via the monthly chore
    image: searxng/searxng@sha256:02d441bbb647b7be422d21041420115cddadac4644368f67c7c7f407bbe72e22
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.5
    # back + default bridge for engine egress; UI is NEVER published to the host
    networks: [back, default]
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp
    logging: *logcap
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  searxng-anon:
    profiles: [anon]
    image: searxng/searxng@sha256:02d441bbb647b7be422d21041420115cddadac4644368f67c7c7f407bbe72e22
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1.0
    # back is internal:true — the ONLY route to the internet is the Tor SOCKS
    # listener meridiand serves on this network. Arti down => no egress at all.
    networks: [back]
    volumes:
      - ./searxng-anon/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp
    logging: *logcap
    depends_on:
      meridiand:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
