[package]
name = "meridian-eval"
description = "Eval + bench harness: nDCG/MRR/Recall eval, meridian-bench on-device suite (SPEC §15), privacy smoke test driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Suites are individually gated so the default workspace `cargo check` stays light
# on the dev Pi (ADR-D1). CI builds with --features bench (and bench-anon for the
# Arti suite). The bin always builds; missing suites report "not compiled in".
default = []
bench = ["bench-embed", "bench-lexical", "bench-ann", "bench-rerank"]
bench-embed = ["dep:model2vec-rs"]
bench-lexical = ["dep:tantivy"]
bench-ann = ["dep:usearch", "dep:cxx"]
bench-rerank = ["dep:tract-onnx", "dep:tokenizers"]
bench-anon = ["dep:arti-client", "dep:tokio", "dep:rustls"]

[dependencies]
meridian-common.workspace = true
meridian-embed.workspace = true
meridian-index.workspace = true
meridian-query.workspace = true
meridian-geo.workspace = true
meridian-rank.workspace = true
meridian-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

model2vec-rs = { workspace = true, optional = true }
tantivy = { workspace = true, optional = true }
usearch = { workspace = true, optional = true }
cxx = { workspace = true, optional = true }
tract-onnx = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
arti-client = { workspace = true, optional = true, features = [
    "tokio",
    "rustls",
    "static-sqlite",
    "compression",
] }
tokio = { workspace = true, optional = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
] }
# arti-client's rustls path needs an app-installed crypto provider (ring on musl)
rustls = { workspace = true, optional = true }

[lints]
workspace = true
