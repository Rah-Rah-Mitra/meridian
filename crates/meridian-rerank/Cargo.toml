[package]
name = "meridian-rerank"
description = "Opt-in deep rerank: INT8 MiniLM cross-encoder via ort, batch=4, cached, strict 1.5s stage deadline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# OFF by default: the deep CE needs ort (glibc ≥2.39 → gnu image, ADR-02). The
# default musl/scratch build is a no-op stub and the planner degrades mode=deep.
default = []
ort-backend = ["dep:ort", "dep:tokenizers"]

[dependencies]
meridian-common.workspace = true
thiserror.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true, features = ["fancy-regex"] }

[lints]
workspace = true
