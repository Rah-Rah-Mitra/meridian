# Model artifact manifest — SPEC §9.6 / §17.
# Artifacts are fetched AT BUILD TIME by the image build script with these pinned
# SHA256s and baked into the meridiand image. The device NEVER downloads models at
# runtime, and binaries are NEVER committed to git.
#
# sha256 = "TBD" entries are placeholders until the Phase-0 build script pins them
# against the exact artifact revisions. Total budget: ≤80MB (SPEC §6.1).

[[model]]
