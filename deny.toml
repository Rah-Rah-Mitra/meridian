# cargo-deny policy — SPEC §13.2 supply chain.
# This is what keeps SearXNG (AGPL) fully external and any LGPL-licensed optional
# Arti feature crates out of the core dependency graph: anything not on the allow
# list fails CI.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Required by unicode-ident (proc-macro ecosystem: syn/serde_derive)
    "Unicode-3.0",
    # blake3 ships CC0-1.0 OR Apache-2.0; fst ships Unlicense OR MIT (verified 2026-06-10)
    "CC0-1.0",
    "Unlicense",
    # ADR-04 license election: arti's graph includes priority-queue
    # (LGPL-3.0-or-later OR MPL-2.0) and r-efi (triple incl. MIT) — we elect
    # MPL-2.0 / MIT respectively. MPL-2.0 is file-level copyleft; the core stays
    # MIT/Apache-clean. AGPL/LGPL/GPL remain denied (not on this list).
    "MPL-2.0",
    # Some transitive deps still declare the older Unicode license id
    "Unicode-DFS-2016",
    # webpki-root-certs (reqwest/rustls CA store): CDLA-Permissive-2.0 — a
    # permissive DATA license for the Mozilla CA bundle; no copyleft obligations.
    # Recorded as a license election alongside MPL-2.0 (ADR-04/ADR-14).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# model2vec-rs declares license-file (verbatim MIT text) instead of an SPDX
# expression — clarify so the graph stays explicit.
[[licenses.clarify]]
crate = "model2vec-rs"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps carry no version requirement; that's fine for a private workspace
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
