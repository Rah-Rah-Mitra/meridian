# cargo-deny policy — SPEC §13.2 supply chain.
# This is what keeps SearXNG (AGPL) fully external and any LGPL-licensed optional
# Arti feature crates out of the core dependency graph: anything not on the allow
# list fails CI.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Required by unicode-ident (proc-macro ecosystem: syn/serde_derive)
    "Unicode-3.0",
    # blake3 ships CC0-1.0 OR Apache-2.0; fst ships Unlicense OR MIT (verified 2026-06-10)
    "CC0-1.0",
    "Unlicense",
]
# NOTE: webpki-roots (MPL-2.0) may arrive with reqwest/rustls in Phase 1. Decision
# deferred to the Phase-1 ADR: either allow MPL-2.0 (file-level copyleft, core stays
# MIT/Apache-clean) or use rustls-native-certs + container CA bundle. Do not add it
# here without recording that ADR.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps carry no version requirement; that's fine for a private workspace
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
