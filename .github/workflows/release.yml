# Meridian release pipeline (WBS 6.6) — runs on version tags.
# linux/arm64 FROM-scratch image to GHCR (the appliance target), SBOM via
# syft, binary + SBOMs attached to the GitHub release.
#
# amd64: SUSPENDED at v0.2.0 (P7 exit — numkong's x86 capabilities.h assumes
# glibc and hard-conflicts with zig-musl), RESTORED at Phase 10 exactly the
# way the suspension note prescribed: a NATIVE gnu binary (full numkong SIMD
# dispatch — never the portable fallback, which is a recall defect per
# ADR-07) on a distroless cc base (deploy/Dockerfile.amd64), stitched with
# the arm64 scratch image into one multi-arch manifest. Parity (risk #27):
# the x86_64 test job + the amd64 boot smoke run on every PR.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/rah-rah-mitra/meridian/meridiand

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: derive build version (release tag, no leading v)
        # Surfaced by GET /v1/config (the image version is the git tag, not
        # Cargo.toml which stays 0.1.0). Baked into every binary via option_env!.
        run: echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, aarch64-unknown-linux-gnu
      - name: deep-image cross toolchain (aarch64-gnu for the ort variant)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-multiarch
      - name: build arm64 (Pi 5 tuning)
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p meridiand
        env:
          MERIDIAN_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          RUSTFLAGS: -C target-cpu=cortex-a76
          # numkong 7.7.0 under zig (ADR-07 P7-exit amendment): the NEON/fp16
          # probes false-negative on GCC feature spellings ('simd'), while the
          # sdot/SVE/SME probes pass — an INCONSISTENT kernel matrix that fails
          # the build. Pin the matrix to the Cortex-A76 reality instead:
          # NEON+sdot on (NEON is mandatory in AArch64; sdot carries the i8
          # cosine path that motivated rung 1), every SVE/SME/f16/bf16/fp8
          # kernel off (zig rejects their flags; the A76 has none of them).
          NK_TARGET_NEON: "1"
          NK_TARGET_NEONSDOT: "1"
          NK_TARGET_NEONHALF: "0"
          NK_TARGET_NEONBFDOT: "0"
          NK_TARGET_NEONFHM: "0"
          NK_TARGET_NEONFP8: "0"
          NK_TARGET_SVE: "0"
          NK_TARGET_SVEHALF: "0"
          NK_TARGET_SVEBFDOT: "0"
          NK_TARGET_SVESDOT: "0"
          NK_TARGET_SVE2: "0"
          NK_TARGET_SVE2P1: "0"
          NK_TARGET_SME: "0"
          NK_TARGET_SME2: "0"
          NK_TARGET_SME2P1: "0"
          NK_TARGET_SMEF64: "0"
          NK_TARGET_SMEHALF: "0"
          NK_TARGET_SMEBF16: "0"
          NK_TARGET_SMEBI32: "0"
          NK_TARGET_SMELUT2: "0"
          NK_TARGET_SMEFA64: "0"
      - name: build amd64 (native gnu — the P10 restoration)
        run: cargo build --release -p meridiand
        env:
          MERIDIAN_BUILD_VERSION: ${{ env.BUILD_VERSION }}
      - name: build deep arm64 (gnu + ort cross-encoder — ADR-31)
        # The deep/gnu variant: deep mode, answer mode and C1 corroboration are
        # DORMANT in the scratch image (no ort, ADR-02); this build carries the
        # cross-encoder. Exact env mirrors ci.yml's proven image-deep job.
        run: >
          cargo build --release --target aarch64-unknown-linux-gnu
          -p meridiand --features rerank-ort
        env:
          MERIDIAN_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          RUSTFLAGS: -C target-cpu=cortex-a76
          NK_TARGET_NEON: "1"
          NK_TARGET_NEONSDOT: "1"
          NK_TARGET_NEONHALF: "0"
          NK_TARGET_NEONBFDOT: "0"
          NK_TARGET_NEONFHM: "0"
          NK_TARGET_NEONFP8: "0"
          NK_TARGET_SVE: "0"
          NK_TARGET_SVEHALF: "0"
          NK_TARGET_SVEBFDOT: "0"
          NK_TARGET_SVESDOT: "0"
          NK_TARGET_SVE2: "0"
          NK_TARGET_SVE2P1: "0"
          NK_TARGET_SME: "0"
          NK_TARGET_SME2: "0"
          NK_TARGET_SME2P1: "0"
          NK_TARGET_SMEF64: "0"
          NK_TARGET_SMEHALF: "0"
          NK_TARGET_SMEBF16: "0"
          NK_TARGET_SMEBI32: "0"
          NK_TARGET_SMELUT2: "0"
          NK_TARGET_SMEFA64: "0"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          # ort fetches the aarch64-gnu ONNX Runtime prebuilt at build time.
          ORT_DOWNLOAD_BINARIES: "1"
      - name: amd64 boot smoke (parity before publish)
        run: |
          mkdir -p /tmp/amd64-models
          bash deploy/fetch-models.sh /tmp/amd64-models
          bash deploy/fetch-gazetteer.sh /tmp/amd64-models
          MERIDIAN_INDEX__DATA_DIR=/tmp/amd64-smoke-data \
          MERIDIAN_MODELS__DIR=/tmp/amd64-models \
          MERIDIAN_SERVER__PORT=18099 \
          ./target/release/meridiand &
          PID=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -sf localhost:18099/healthz > /dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$PID"
          test -n "$ok"
      - name: stage image contents
        run: |
          mkdir -p deploy/stage/linux/arm64
          cp target/aarch64-unknown-linux-musl/release/meridiand deploy/stage/linux/arm64/
          bash deploy/fetch-models.sh deploy/stage/models
          bash deploy/fetch-gazetteer.sh deploy/stage/models
          mkdir -p deploy/stage-amd64
          cp target/release/meridiand deploy/stage-amd64/
          cp -r deploy/stage/models deploy/stage-amd64/models
      - name: stage deep image contents (ADR-31)
        run: |
          mkdir -p deploy/stage-deep
          cp target/aarch64-unknown-linux-gnu/release/meridiand deploy/stage-deep/
          # ort statically links ONNX Runtime — no .so to copy.
          cp -r deploy/stage/models deploy/stage-deep/models
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push images (arm64 scratch + amd64 distroless) + manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/arm64 -f deploy/Dockerfile \
            -t "$IMAGE:$VERSION-arm64" --push deploy
          docker buildx build --platform linux/amd64 -f deploy/Dockerfile.amd64 \
            -t "$IMAGE:$VERSION-amd64" --push deploy
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-arm64" "$IMAGE:$VERSION-amd64"
      - name: build + push deep image (arm64 gnu + ort — ADR-31)
        # arm64-only (the live appliance is the Pi 5); NOT folded into the
        # multi-arch manifest — :latest/:VERSION stay the canonical scratch
        # appliance (ADR-02). Operators opt into :VERSION-deep-arm64 explicitly.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/arm64 -f deploy/Dockerfile.deep \
            -t "$IMAGE:$VERSION-deep-arm64" --push deploy
      - name: deep image size (informational — well over the scratch 120MB budget)
        # The deep image carries ort + ONNX Runtime + the CE model, so the
        # scratch tripwire does NOT apply; report the size, never fail on it.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RAW=$(docker buildx imagetools inspect "$IMAGE:$VERSION-deep-arm64" --raw)
          if ! echo "$RAW" | jq -e '.layers' > /dev/null; then
            DIGEST=$(echo "$RAW" | jq -r '[.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux")][0].digest')
            RAW=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)
          fi
          BYTES=$(echo "$RAW" | jq '[.layers[].size] | add')
          echo "deep image compressed layers: $BYTES bytes (informational, no gate)"
      - name: amd64 image size tripwire (budget ≤120MB compressed)
        # buildx pushes an OCI INDEX (image + provenance attestation), so the
        # tag-level manifest has no .layers — resolve through to the
        # platform manifest first (v0.5.0 release attempt 1 failed here on
        # `jq: Cannot iterate over null`).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RAW=$(docker buildx imagetools inspect "$IMAGE:$VERSION-amd64" --raw)
          if ! echo "$RAW" | jq -e '.layers' > /dev/null; then
            DIGEST=$(echo "$RAW" | jq -r '[.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux")][0].digest')
            RAW=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)
          fi
          BYTES=$(echo "$RAW" | jq '[.layers[].size] | add')
          echo "amd64 compressed layers: $BYTES bytes"
          test "$BYTES" -le 125829120
      # Direct syft (pinned): sbom-action cannot select a platform, and the
      # image is arm64-only since v0.2.0 — syft on the amd64 runner otherwise
      # asks the manifest for linux/amd64 and fails (release attempt 4).
      # Registry auth via syft's own env (attempt 3 failed UNAUTHORIZED).
      - name: SBOM (syft, spdx-json) — image
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.42.3
          syft scan "registry:$IMAGE:latest" --platform linux/arm64 \
            -o spdx-json=sbom-image.spdx.json
          syft scan "registry:$IMAGE:latest" --platform linux/amd64 \
            -o spdx-json=sbom-image-amd64.spdx.json
          VERSION="${GITHUB_REF_NAME#v}"
          syft scan "registry:$IMAGE:$VERSION-deep-arm64" --platform linux/arm64 \
            -o spdx-json=sbom-image-deep.spdx.json
        env:
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (cargo workspace)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          upload-artifact: false
      - name: package binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/aarch64-unknown-linux-musl/release/meridiand" "meridiand-${VERSION}-aarch64-linux-musl"
          cp "target/release/meridiand" "meridiand-${VERSION}-x86_64-linux-gnu"
          # arm64-gnu deep binary, for operators who run the CE variant bare.
          cp "target/aarch64-unknown-linux-gnu/release/meridiand" "meridiand-${VERSION}-aarch64-linux-gnu-deep"
          sha256sum meridiand-* sbom-*.json > SHA256SUMS
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Meridian $GITHUB_REF_NAME" \
            --notes-file docs/release-notes/$GITHUB_REF_NAME.md \
            meridiand-* sbom-image.spdx.json sbom-image-amd64.spdx.json sbom-image-deep.spdx.json sbom-source.spdx.json SHA256SUMS
