# Meridian release pipeline (WBS 6.6) — runs on version tags.
# Multi-arch (linux/arm64 + linux/amd64) FROM-scratch images to GHCR, SBOM via
# syft, binaries + SBOM attached to the GitHub release. Both binaries are
# static musl zigbuilds; arm64 keeps the Cortex-A76 tuning (the appliance
# target), amd64 uses the portable x86-64-v2 baseline.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/rah-rah-mitra/meridian/meridiand

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-multiarch
      - name: build arm64 (Pi 5 tuning)
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p meridiand
        env:
          RUSTFLAGS: -C target-cpu=cortex-a76
      - name: build amd64 (portable v2 baseline)
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p meridiand
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
      - name: stage image contents
        run: |
          mkdir -p deploy/stage/linux/arm64 deploy/stage/linux/amd64
          cp target/aarch64-unknown-linux-musl/release/meridiand deploy/stage/linux/arm64/
          cp target/x86_64-unknown-linux-musl/release/meridiand deploy/stage/linux/amd64/
          bash deploy/fetch-models.sh deploy/stage/models
          bash deploy/fetch-gazetteer.sh deploy/stage/models
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push multi-arch manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/arm64,linux/amd64 -f deploy/Dockerfile \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push deploy
      - name: SBOM (syft, spdx-json) — image + workspace
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:latest
          format: spdx-json
          output-file: sbom-image.spdx.json
          upload-artifact: false
      - name: SBOM (cargo workspace)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          upload-artifact: false
      - name: package binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in aarch64 x86_64; do
            cp "target/${ARCH}-unknown-linux-musl/release/meridiand" "meridiand-${VERSION}-${ARCH}-linux-musl"
          done
          sha256sum meridiand-* sbom-*.json > SHA256SUMS
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Meridian $GITHUB_REF_NAME" \
            --notes-file docs/release-notes/$GITHUB_REF_NAME.md \
            meridiand-* sbom-image.spdx.json sbom-source.spdx.json SHA256SUMS
