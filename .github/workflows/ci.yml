# Meridian CI — SPEC §14.
# All real builds happen here: the deployment Pi never compiles anything, and the
# dev Pi only runs cargo check/clippy locally (see docs/plan/00-adr.md, ADR-D1).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  audit:
    name: cargo-audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-aarch64:
    name: cross-build aarch64-musl (Pi 5 target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-musl
      # SPEC §7.1: NEON+dotprod autovectorization for the Cortex-A76
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl --workspace
        env:
          RUSTFLAGS: -C target-cpu=cortex-a76
      - name: binary report
        run: |
          ls -la target/aarch64-unknown-linux-musl/release/meridiand
          file target/aarch64-unknown-linux-musl/release/meridiand
      - uses: actions/upload-artifact@v4
        with:
          name: meridiand-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/meridiand
          retention-days: 14

  privacy-smoke:
    # SPEC §13.4/§15: canary query + canary client IP driven through the real
    # binary; zero occurrences allowed in logs, /metrics, or /data. Merge-blocking.
    name: privacy smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: privacy-smoke
      - run: bash deploy/fetch-models.sh models
      - run: cargo build -p meridiand
      - run: MERIDIAN_MODELS__DIR=models bash deploy/privacy-smoke.sh target/debug/meridiand

  bench-build:
    # GNU (not musl) deliberately: tract-linalg's SVE f16 kernels pass `-march=
    # armv8.2-a+sve+fp16` — a GCC extension spelling that zig's clang rejects
    # (clang wants `fullfp16`), so zigbuild cannot build tract today (ADR-02
    # evidence). The bench binary is a dev tool for the glibc Pi (2.41 ≥ the
    # runner toolchain's 2.39 floor); the PRODUCT image stays zigbuild+musl.
    name: build meridian-bench aarch64-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-aarch64-gnu
      # release-bench = release profile with thin LTO (divergence recorded in every
      # bench report header). Suites: all 8 incl. the Arti anon suite.
      - run: >
          cargo build --profile release-bench
          --target aarch64-unknown-linux-gnu
          -p meridian-eval --features bench,bench-anon
          --bin meridian-bench --bin meridian-eval
        env:
          RUSTFLAGS: -C target-cpu=cortex-a76
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      - run: ls -la target/aarch64-unknown-linux-gnu/release-bench/meridian-bench target/aarch64-unknown-linux-gnu/release-bench/meridian-eval
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-bench-aarch64
          path: |
            target/aarch64-unknown-linux-gnu/release-bench/meridian-bench
            target/aarch64-unknown-linux-gnu/release-bench/meridian-eval
          retention-days: 14

  # Phase-0 exit gate (SPEC §16): FROM scratch image <120MB, pushed to GHCR on main.
  image:
    name: scratch image → GHCR (linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: image-aarch64-musl
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p meridiand
        env:
          RUSTFLAGS: -C target-cpu=cortex-a76
      - name: stage image contents (binary + verified models)
        run: |
          mkdir -p deploy/stage
          cp target/aarch64-unknown-linux-musl/release/meridiand deploy/stage/
          bash deploy/fetch-models.sh deploy/stage/models
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build image (arm64) and enforce the 120MB gate
        run: |
          docker buildx build --platform linux/arm64 -f deploy/Dockerfile \
            -t ghcr.io/rah-rah-mitra/meridian/meridiand:ci --load deploy
          SIZE=$(docker image inspect -f '{{.Size}}' ghcr.io/rah-rah-mitra/meridian/meridiand:ci)
          echo "image size: $SIZE bytes"
          test "$SIZE" -lt $((120 * 1024 * 1024)) || { echo "IMAGE EXCEEDS 120MB GATE"; exit 1; }
      # The repo (and so the GHCR package) is private; device tokens may lack
      # read:packages. The tarball artifact is the guaranteed delivery path:
      #   gh run download <id> -n meridiand-image && docker load < meridiand-image.tar
      - name: save image tarball artifact
        run: docker save ghcr.io/rah-rah-mitra/meridian/meridiand:ci -o meridiand-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: meridiand-image
          path: meridiand-image.tar
          retention-days: 14
      - name: push to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag + push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for TAG in "$VERSION" "sha-${GITHUB_SHA::7}" latest; do
            docker tag ghcr.io/rah-rah-mitra/meridian/meridiand:ci \
              ghcr.io/rah-rah-mitra/meridian/meridiand:$TAG
            docker push ghcr.io/rah-rah-mitra/meridian/meridiand:$TAG
          done

  image-deep:
    # mode=deep variant (ADR-02): gnu + ort cross-encoder. Built natively-ish via
    # the gnu cross toolchain; distroless-cc base (glibc 2.39+). Informational —
    # not the default deploy image; operators opt into deep mode.
    name: deep image (aarch64-gnu + ort) → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: image-deep-aarch64-gnu
      - name: build meridiand with the ort rerank backend
        run: >
          cargo build --release --target aarch64-unknown-linux-gnu
          -p meridiand --features rerank-ort
        env:
          RUSTFLAGS: -C target-cpu=cortex-a76
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          # ort downloads the aarch64-gnu ONNX Runtime prebuilt at build time
          ORT_DOWNLOAD_BINARIES: "1"
      - name: stage deep image contents
        run: |
          mkdir -p deploy/stage-deep
          cp target/aarch64-unknown-linux-gnu/release/meridiand deploy/stage-deep/
          # ort copy-dylibs places libonnxruntime next to the binary
          find target/aarch64-unknown-linux-gnu/release -maxdepth 1 -name 'libonnxruntime*' -exec cp {} deploy/stage-deep/ \; || true
          bash deploy/fetch-models.sh deploy/stage-deep/models
      - run: ls -la deploy/stage-deep
      - uses: actions/upload-artifact@v4
        with:
          name: meridiand-deep-aarch64-gnu
          path: target/aarch64-unknown-linux-gnu/release/meridiand
          retention-days: 14
